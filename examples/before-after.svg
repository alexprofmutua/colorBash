<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">colorbash before and after</title>
  <desc id="desc">Side-by-side terminal mockups showing the default ls output before and the custom test_case folder color after using colorbash.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="100%" stop-color="#131b24"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1600" height="860" fill="url(#page)"/>

  <text x="800" y="84" fill="#f0f6fc" font-size="44" text-anchor="middle" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">colorbash example</text>
  <text x="800" y="122" fill="#8b949e" font-size="24" text-anchor="middle" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">change one folder name without changing the others</text>

  <text x="395" y="186" fill="#f0f6fc" font-size="30" text-anchor="middle" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">Before</text>
  <text x="1205" y="186" fill="#f0f6fc" font-size="30" text-anchor="middle" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">After</text>

  <g filter="url(#shadow)">
    <rect x="70" y="220" width="650" height="510" rx="24" fill="url(#panel)" stroke="#30363d"/>
    <rect x="70" y="220" width="650" height="52" rx="24" fill="#21262d"/>
    <rect x="70" y="248" width="650" height="482" fill="url(#panel)"/>
    <circle cx="106" cy="246" r="8" fill="#ff5f56"/>
    <circle cx="132" cy="246" r="8" fill="#ffbd2e"/>
    <circle cx="158" cy="246" r="8" fill="#27c93f"/>
    <text x="395" y="254" fill="#c9d1d9" font-size="17" text-anchor="middle" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">~/Projects/demo</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="880" y="220" width="650" height="510" rx="24" fill="url(#panel)" stroke="#30363d"/>
    <rect x="880" y="220" width="650" height="52" rx="24" fill="#21262d"/>
    <rect x="880" y="248" width="650" height="482" fill="url(#panel)"/>
    <circle cx="916" cy="246" r="8" fill="#ff5f56"/>
    <circle cx="942" cy="246" r="8" fill="#ffbd2e"/>
    <circle cx="968" cy="246" r="8" fill="#27c93f"/>
    <text x="1205" y="254" fill="#c9d1d9" font-size="17" text-anchor="middle" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">~/Projects/demo</text>
  </g>

  <text x="108" y="322" fill="#7ee787" font-size="24" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">alexprof@macbook</text>
  <text x="350" y="322" fill="#58a6ff" font-size="24" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">demo</text>
  <text x="414" y="322" fill="#c9d1d9" font-size="24" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">$ ls</text>

  <text x="918" y="322" fill="#7ee787" font-size="24" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">alexprof@macbook</text>
  <text x="1160" y="322" fill="#58a6ff" font-size="24" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">demo</text>
  <text x="1224" y="322" fill="#c9d1d9" font-size="24" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">$ ls</text>

  <text x="108" y="396" fill="#58a6ff" font-size="30" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">another_folder</text>
  <text x="430" y="396" fill="#58a6ff" font-size="30" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">docs</text>
  <text x="540" y="396" fill="#58a6ff" font-size="30" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">test_case</text>

  <text x="918" y="396" fill="#58a6ff" font-size="30" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">another_folder</text>
  <text x="1240" y="396" fill="#58a6ff" font-size="30" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">docs</text>
  <text x="1350" y="396" fill="#ff4d4f" font-size="30" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">test_case</text>

  <rect x="108" y="468" width="520" height="92" rx="14" fill="#11161d" stroke="#30363d"/>
  <text x="132" y="506" fill="#8b949e" font-size="18" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">default behavior</text>
  <text x="132" y="540" fill="#c9d1d9" font-size="24" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">all folders share the same color</text>

  <rect x="918" y="468" width="520" height="122" rx="14" fill="#11161d" stroke="#30363d"/>
  <text x="942" y="506" fill="#8b949e" font-size="18" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">after saving a rule</text>
  <text x="942" y="540" fill="#c9d1d9" font-size="24" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">cb test_case</text>
  <text x="1180" y="540" fill="#ff4d4f" font-size="24" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">red</text>
  <text x="942" y="574" fill="#8b949e" font-size="20" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">only test_case changes</text>

  <text x="800" y="802" fill="#8b949e" font-size="20" text-anchor="middle" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">This is a visual mockup of the terminal behavior, so your exact font and colors may vary slightly.</text>
</svg>
