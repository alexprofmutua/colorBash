<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Before colorbash</title>
  <desc id="desc">A terminal mockup showing all folders with the same default directory color before applying a custom color rule.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#0a0f14"/>

  <text x="600" y="78" fill="#f0f6fc" font-size="42" text-anchor="middle" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">Before</text>
  <text x="600" y="114" fill="#8b949e" font-size="22" text-anchor="middle" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">plain ls output</text>

  <g filter="url(#shadow)">
    <rect x="110" y="150" width="980" height="470" rx="24" fill="url(#bg)" stroke="#30363d"/>
    <rect x="110" y="150" width="980" height="52" rx="24" fill="#21262d"/>
    <rect x="110" y="178" width="980" height="444" rx="0" fill="url(#bg)"/>
    <circle cx="146" cy="176" r="8" fill="#ff5f56"/>
    <circle cx="172" cy="176" r="8" fill="#ffbd2e"/>
    <circle cx="198" cy="176" r="8" fill="#27c93f"/>
    <text x="600" y="184" fill="#c9d1d9" font-size="18" text-anchor="middle" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">alexprof@macbook: ~/Projects/demo</text>
  </g>

  <text x="150" y="258" fill="#7ee787" font-size="28" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">alexprof@macbook</text>
  <text x="430" y="258" fill="#58a6ff" font-size="28" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">demo</text>
  <text x="505" y="258" fill="#c9d1d9" font-size="28" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">$ ls</text>

  <text x="150" y="334" fill="#58a6ff" font-size="34" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">another_folder</text>
  <text x="520" y="334" fill="#58a6ff" font-size="34" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">docs</text>
  <text x="675" y="334" fill="#58a6ff" font-size="34" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">test_case</text>

  <text x="150" y="404" fill="#8b949e" font-size="24" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">All directories use the same default color.</text>

  <rect x="150" y="458" width="380" height="88" rx="14" fill="#11161d" stroke="#30363d"/>
  <text x="176" y="494" fill="#8b949e" font-size="18" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">No custom rule yet</text>
  <text x="176" y="528" fill="#c9d1d9" font-size="26" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">cb list</text>
  <text x="296" y="528" fill="#8b949e" font-size="26" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace">→ empty</text>
</svg>
